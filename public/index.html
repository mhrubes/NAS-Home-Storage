<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAS úložiště</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --ok:#22c55e; --warn:#f59e0b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --line:#2b2f37; --accent:#5b8def; --danger:#f0605d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  .hidden { display:none !important; }
  button, input, select { font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; filter:none !important; }
  input[type=text], input[type=password], input[type=search], select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }

  #login { min-height:100vh; display:grid; place-items:center; padding:16px; }
  #login form { background:var(--card); padding:28px; border-radius:12px; width:100%; max-width:340px; display:grid; gap:12px; border:1px solid var(--line); }
  #login h1 { margin:0 0 4px; font-size:20px; }
  .err { color:var(--danger); min-height:1.2em; font-size:14px; }

  #app { max-width:980px; margin:0 auto; padding:16px 16px 70px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  header h1 { margin:0; font-size:20px; }
  .space { flex:1; max-width:300px; min-width:120px; font-size:12px; color:var(--muted); }
  .space .bar { height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:3px; }
  .space .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  .space.low .bar i { background:var(--warn); }
  .space.crit .bar i { background:var(--danger); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .sp { flex:1; }
  .search { position:relative; flex:1 1 200px; max-width:340px; }
  .search input { padding-left:32px; padding-right:30px; }
  .search input::-webkit-search-cancel-button { display:none; }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; pointer-events:none; }
  .search .clear { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:24px; height:24px; padding:0; background:transparent; color:var(--muted); border:0; }
  .count { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center; pointer-events:none; }
  .crumbs { margin-bottom:8px; color:var(--muted); word-break:break-all; }
  .crumbs a { color:var(--accent); cursor:pointer; }
  .crumbs a.over { outline:2px solid var(--accent); border-radius:4px; }

  #selbar { position:sticky; top:8px; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px; margin-bottom:10px; background:color-mix(in srgb, var(--accent) 14%, var(--card)); border:1px solid var(--accent); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.2); }
  #selbar strong { margin-right:auto; }

  .list { background:var(--card); border:1px solid var(--line); border-radius:10px; } /* bez overflow:hidden, aby tooltipy nebyly oriznute */
  .list > .row:first-child { border-radius:10px 10px 0 0; }
  .list > .row:last-child { border-radius:0 0 10px 10px; }
  .list > .row:only-child { border-radius:10px; }
  .row { display:grid; grid-template-columns: 24px minmax(0,1fr) 84px 150px 216px; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row input[type=checkbox] { width:16px; height:16px; margin:0; cursor:pointer; accent-color:var(--accent); }
  .row.selected { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .row .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .row .name a { color:inherit; cursor:pointer; text-decoration:none; }
  .row .name a:hover { color:var(--accent); }
  .row .path { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  .row .path a { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; white-space:nowrap; }
  .meta.size { text-align:right; padding-right:20px; }
  .sub { display:none; color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:4px; justify-content:flex-end; }
  .actions .ibtn { width:32px; height:32px; }
  /* ikonova tlacitka s tooltipem (data-tip), zobrazi se po najeti nebo fokusu klavesnici */
  .ibtn { position:relative; width:36px; height:36px; padding:0; display:inline-grid; place-items:center; }
  .ibtn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  [data-tip]::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(2px); background:var(--text); color:var(--bg); padding:4px 9px; border-radius:6px; font-size:12px; font-weight:500; line-height:1.4; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s, transform .12s; z-index:30; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity:1; transform:translateX(-50%); }
  [data-tip]:hover, [data-tip]:focus-visible { z-index:50; }
  header { position:relative; z-index:35; }
  /* tooltip pod tlacitkem (pro tlacitka u horniho okraje, kde by nad nimi neprevysel misto) */
  [data-tip].tip-below::after { bottom:auto; top:calc(100% + 8px); }
  [data-tip].tip-start::after { left:0; transform:translateY(2px); }
  [data-tip].tip-start:hover::after, [data-tip].tip-start:focus-visible::after { transform:none; }
  [data-tip].tip-end::after { left:auto; right:0; transform:translateY(2px); }
  [data-tip].tip-end:hover::after, [data-tip].tip-end:focus-visible::after { transform:none; }
  .row.head { background:color-mix(in srgb, var(--muted) 8%, transparent); color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding-top:8px; padding-bottom:8px; }
  .row.head .sortable { cursor:pointer; user-select:none; }
  .row.head .sortable:hover { color:var(--text); }
  .row.head > :nth-child(3) { text-align:right; padding-right:20px; }
  .row.head > :nth-child(5) { text-align:right; }
  .row[draggable=true] { cursor:grab; }
  .row.over { background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .row.dragging { opacity:.4; }
  /* zamky a sdileni */
  .badge { display:inline-flex; vertical-align:-2px; margin-left:8px; }
  .badge svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .badge.locked { color:var(--warn); }
  .badge.open { color:var(--ok); }
  .badge.inherit, .badge.share { color:var(--muted); }
  .badge.share { color:var(--accent); }
  .row.locked .name a { opacity:.75; }
  .row.locked { background:color-mix(in srgb, var(--warn) 7%, transparent); }

  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:0; width:min(92vw, 420px); box-shadow:0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(0,0,0,.5); backdrop-filter:blur(3px); }
  dialog[open] { animation:pop .15s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.97); } }
  dialog form, dialog .dbody { padding:22px; display:grid; gap:12px; }
  dialog h2 { margin:0; font-size:18px; word-break:break-word; }
  dialog p { margin:0; color:var(--muted); word-break:break-word; }
  dialog label { font-size:13px; color:var(--muted); margin-bottom:-6px; }
  .dlgActions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .dlgErr { color:var(--danger); font-size:14px; }
  .dlgErr:empty { display:none; }
  button.dangerSolid { background:var(--danger); }
  dialog.wide { width:min(94vw, 640px); }
  dialog.pv { width:min(96vw, 1000px); }
  .pvhead { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .pvhead h2 { flex:1; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pvbody { display:grid; place-items:center; min-height:200px; max-height:78vh; overflow:auto; padding:12px; background:var(--bg); }
  .pvbody img, .pvbody video { max-width:100%; max-height:74vh; }
  .pvbody iframe { width:100%; height:74vh; border:0; background:#fff; }
  .pvbody pre { margin:0; width:100%; white-space:pre-wrap; word-break:break-word; font:13px/1.5 ui-monospace, Consolas, monospace; align-self:start; }
  .pvnote { font-size:12px; color:var(--muted); padding:6px 16px; border-top:1px solid var(--line); }
  .list-mini { display:grid; gap:2px; max-height:280px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:4px; }
  .list-mini .li { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; cursor:pointer; }
  .list-mini .li:hover { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .list-mini .li.disabled { opacity:.4; cursor:default; }
  .list-mini .li.disabled:hover { background:transparent; }
  .shrow { display:grid; grid-template-columns: minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .shrow:last-child { border-bottom:0; }
  .shrow .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shrow .m { font-size:12px; color:var(--muted); }
  .linkbox { display:flex; gap:6px; }
  .linkbox input { flex:1; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text) !important; margin-bottom:0 !important; }

  #uploads { position:fixed; left:16px; bottom:88px; width:min(340px, calc(100vw - 32px)); max-height:50vh; overflow:auto; z-index:25; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  #uploads .uh { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
  #uploads .uh span { flex:1; }
  #uploads .uh button { padding:2px 8px; font-size:12px; }
  .up { padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .up:last-child { border-bottom:0; }
  .up .n { display:flex; gap:8px; align-items:center; }
  .up .n b { flex:1; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up .n button { padding:0 6px; font-size:14px; line-height:20px; background:transparent; color:var(--muted); border:0; }
  .up .bar { height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:5px; }
  .up .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .up.done .bar i { background:var(--ok); }
  .up.error .bar i { background:var(--danger); }
  .up .st { color:var(--muted); font-size:12px; margin-top:2px; }
  .up.error .st { color:var(--danger); }

  #toasts { position:fixed; right:16px; bottom:16px; display:grid; gap:8px; z-index:40; max-width:calc(100vw - 32px); }
  .toast { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); color:var(--text); padding:10px 16px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); transition:.25s; }
  .toast.show { opacity:1; transform:none; }
  .toast.error { border-left-color:var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { transition:filter .15s; } button:hover:not(:disabled) { filter:brightness(1.12); }
  #ring { position:fixed; left:16px; bottom:16px; width:60px; height:60px; border-radius:50%; background:var(--card); border:1px solid var(--line); box-shadow:0 6px 20px rgba(0,0,0,.25); display:grid; place-items:center; z-index:10; cursor:default; }
  #ring svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:3; }
  #ring .bg { stroke:var(--line); }
  #ring .fg { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .9s linear, stroke .3s; }
  #ring.warn .fg { stroke:var(--warn); }
  #ring.danger .fg { stroke:var(--danger); }
  #ringText { position:relative; font-size:13px; font-variant-numeric:tabular-nums; font-weight:600; }
  #ring.danger #ringText { color:var(--danger); }
  .appver { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); font-size:12px; color:var(--muted); opacity:.7; pointer-events:none; font-variant-numeric:tabular-nums; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:14px; text-align:center; color:var(--muted); margin-bottom:12px; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  .viewhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .viewhead h2 { margin:0; font-size:17px; flex:1; }
  @media (max-width:760px) {
    .row.head { display:none; }
    .row { grid-template-columns: 24px minmax(0,1fr); }
    .row .meta { display:none; }
    .row .actions { grid-column:2; justify-content:flex-start; flex-wrap:wrap; }
    .sub { display:block; }
    .space { order:3; max-width:none; flex-basis:100%; }
    header { flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form id="loginForm">
    <h1>NAS úložiště</h1>
    <input type="text" id="user" placeholder="Uživatel" autocomplete="username" required>
    <input type="password" id="pass" placeholder="Heslo" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button type="submit">Přihlásit</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>NAS úložiště</h1>
    <div class="space" id="space" title="Volné místo na disku"><span id="spaceText"></span><div class="bar"><i id="spaceBar"></i></div></div>
    <button class="ghost ibtn tip-end tip-below" id="logout" data-tip="Odhlásit" aria-label="Odhlásit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </header>
  <div class="toolbar" id="toolbar">
    <button class="ibtn tip-start tip-below" id="upBtn" data-tip="Nahrát soubory" aria-label="Nahrát soubory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
    <button class="ghost ibtn tip-below" id="upDirBtn" data-tip="Nahrát složku" aria-label="Nahrát složku"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="m9 14 3-3 3 3"/><path d="M12 11v6"/></svg></button>
    <button class="ghost ibtn tip-below" id="mkdirBtn" data-tip="Nová složka" aria-label="Nová složka"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg></button>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Hledat (/)" autocomplete="off" aria-label="Hledat v názvech">
      <button class="clear hidden" id="searchClear" aria-label="Zrušit hledání" title="Zrušit hledání (Esc)">✕</button>
    </div>
    <span class="sp"></span>
    <button class="ghost ibtn tip-below" id="sharesBtn" data-tip="Sdílené odkazy" aria-label="Sdílené odkazy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button class="ghost ibtn tip-end tip-below" id="trashBtn" data-tip="Koš" aria-label="Koš"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="count hidden" id="trashCount"></span></button>
    <input type="file" id="fileInput" multiple class="hidden">
    <input type="file" id="dirInput" webkitdirectory class="hidden">
  </div>
  <div id="selbar" class="hidden"></div>
  <div id="drop">Přetáhni soubory nebo složky sem</div>
  <div class="crumbs" id="crumbs"></div>
  <div id="viewhead"></div>
  <div class="list" id="list"></div>
</div>

<dialog id="dlg">
  <form id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <label id="dlgLabel" for="dlgInput"></label>
    <input type="text" id="dlgInput" autocomplete="off" maxlength="255">
    <label id="dlgLabel2" for="dlgInput2" class="hidden"></label>
    <input type="password" id="dlgInput2" class="hidden" autocomplete="new-password">
    <div class="dlgErr" id="dlgErr"></div>
    <div class="dlgActions">
      <button type="button" class="ghost" id="dlgCancel">Zrušit</button>
      <button type="submit" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<dialog id="panel" class="wide">
  <div class="dbody">
    <h2 id="panelTitle"></h2>
    <div id="panelBody" style="display:grid;gap:12px"></div>
    <div class="dlgActions"><button type="button" class="ghost" id="panelClose">Zavřít</button></div>
  </div>
</dialog>

<dialog id="cnf">
  <form method="dialog" class="dbody" id="cnfForm">
    <h2>Soubor už existuje</h2>
    <p id="cnfText"></p>
    <label class="chk" id="cnfAllWrap"><input type="checkbox" id="cnfAll"> Použít pro všechny další soubory</label>
    <div class="dlgActions">
      <button type="button" class="ghost" data-c="skip">Přeskočit</button>
      <button type="button" class="ghost" data-c="rename">Ponechat obě</button>
      <button type="button" data-c="overwrite">Přepsat</button>
    </div>
  </form>
</dialog>

<dialog id="pick">
  <div class="dbody">
    <h2 id="pickTitle">Vyber složku</h2>
    <div class="crumbs" id="pickCrumbs" style="margin:0"></div>
    <div class="list-mini" id="pickList"></div>
    <div class="dlgActions">
      <button type="button" class="ghost" id="pickCancel">Zrušit</button>
      <button type="button" id="pickOk">Vybrat</button>
    </div>
  </div>
</dialog>

<dialog id="pv" class="pv">
  <div class="pvhead">
    <button class="ghost ibtn" id="pvPrev" aria-label="Předchozí" title="Předchozí (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="ghost ibtn" id="pvNext" aria-label="Další" title="Další (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    <h2 id="pvTitle"></h2>
    <a class="ibtn" id="pvDl" style="text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:6px" title="Stáhnout" aria-label="Stáhnout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></a>
    <button class="ghost ibtn" id="pvClose" aria-label="Zavřít" title="Zavřít (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="pvbody" id="pvBody"></div>
  <div class="pvnote hidden" id="pvNote"></div>
</dialog>

<div id="uploads" class="hidden"></div>
