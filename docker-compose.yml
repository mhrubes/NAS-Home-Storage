services:
  storage:
    build: .
    container_name: nas-storage
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data
    ports:
      - "${APP_PORT:-3001}:3000"   # port na NASu; 3000 obsazuje faktura-app
    volumes:
      # cesta na NASu, kam se ukladaji soubory (nastav STORAGE_PATH v .env, jinak ./data)
      - ${STORAGE_PATH:-./data}:/data
